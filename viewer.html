<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Saved Session Reader</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #0d1117; color: #c9d1d9; }
        .meta-bar { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #21262d; padding-bottom: 12px; margin-bottom: 30px; }
        h2 { margin: 0; font-size: 18px; color: #f0f6fc; }
        #meta { font-size: 12px; color: #8b949e; }
        .turn { margin-bottom: 24px; border: 1px solid #30363d; border-radius: 6px; overflow: hidden; }
        .turn.user .header { background: #161b22; color: #58a6ff; border-bottom: 1px solid #30363d; }
        .turn.gemini .header { background: #161b22; color: #bc8cff; border-bottom: 1px solid #30363d; }
        .header { padding: 8px 16px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .content { padding: 16px; font-size: 14px; overflow-wrap: break-word; }
        table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 13px; }
        th, td { border: 1px solid #30363d; padding: 8px 12px; text-align: left; }
        th { background: #161b22; }
        pre { background: #161b22; padding: 12px; border-radius: 6px; overflow-x: auto; }
        code { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 12px; }
        .empty { text-align: center; color: #8b949e; margin-top: 80px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="meta-bar">
        <h2>Saved Session Reader</h2>
        <div id="meta">Reading storage...</div>
    </div>

    <div id="chat-container"></div>

    <!-- External script to adhere to MV3 CSP rules -->
    <script src="viewer.js"></script>
</body>
</html>
