<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Saved Session Reader</title>
    <style>
        :root {
            --bg: #111215;
            --sidebar-bg: #16171b;
            --panel: #1b1c21;
            --card-user: #181c24;
            --card-ai: #1b1c22;
            --border: #282a32;
            --border-hover: #3e414d;
            --text-main: #e2e4e9;
            --text-secondary: #9aa0ad;
            --accent-user: #60a5fa;
            --accent-ai: #c084fc;
            --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; }
        body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; font-size: 14px; }
        
        /* Sidebar */
        #sidebar { width: 300px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-head { padding: 16px; border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); font-family: var(--mono); }
        #session-list { flex: 1; overflow-y: auto; padding: 10px; }
        
        .session-item { padding: 12px 14px; margin-bottom: 6px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; background: transparent; transition: background 0.15s, border-color 0.15s; }
        .session-item:hover { background: #1f2026; border-color: var(--border); }
        .session-item.active { background: #23252d; border-color: var(--border-hover); }
        .session-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); margin-bottom: 4px; }
        .session-meta { font-size: 11px; color: var(--text-secondary); font-family: var(--mono); }

        /* Main Workspace */
        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Top Control Bar */
        #toolbar { background: var(--sidebar-bg); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
        .toolbar-group { display: flex; align-items: center; gap: 12px; }
        
        select { background: var(--panel); color: var(--text-main); border: 1px solid var(--border); padding: 6px 10px; font-size: 12px; border-radius: 4px; outline: none; font-weight: 500; }
        select:focus { border-color: var(--border-hover); }

        .cb-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); cursor: pointer; user-select: none; font-weight: 500; }
        .cb-row input { margin: 0; width: 14px; height: 14px; accent-color: #4f46e5; cursor: pointer; }
        
        .btn-group { display: flex; gap: 6px; }
        button { background: var(--panel); border: 1px solid var(--border); color: var(--text-main); padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 4px; transition: background 0.15s, border-color 0.15s; font-family: var(--sans); }
        button:hover { background: #282a32; border-color: var(--border-hover); }

        /* Reading Area */
        #content-area { flex: 1; overflow-y: auto; padding: 30px 40px; }
        .container { max-width: 820px; margin: 0 auto; }
        
        .turn { margin-bottom: 24px; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
        .turn.user { background: var(--card-user); border-color: #273042; }
        .turn.gemini { background: var(--card-ai); border-color: var(--border); }

        .turn-head { padding: 10px 16px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between; font-family: var(--mono); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .turn.user .turn-head { color: var(--accent-user); background: rgba(96, 165, 250, 0.05); }
        .turn.gemini .turn-head { color: var(--accent-ai); background: rgba(192, 132, 252, 0.05); }
        .turn-time { color: var(--text-secondary); font-weight: 400; }

        .turn-body { padding: 18px 20px; line-height: 1.65; font-size: 15px; color: var(--text-main); overflow-wrap: break-word; }
        .turn-body p { margin-top: 0; margin-bottom: 14px; }
        .turn-body p:last-child { margin-bottom: 0; }
        .turn-body ul, .turn-body ol { margin: 8px 0 14px 20px; padding: 0; }
        .turn-body li { margin-bottom: 6px; }

        /* Media & Code */
        img { max-width: 100%; height: auto; border-radius: 6px; display: block; margin: 14px 0; border: 1px solid var(--border); }
        .file-preview-container img { max-width: 320px; }
        
        pre { background: #0c0d10; padding: 14px 16px; border-radius: 6px; border: 1px solid var(--border); overflow-x: auto; font-family: var(--mono); font-size: 13px; line-height: 1.5; }
        code { font-family: var(--mono); font-size: 13px; background: rgba(255,255,255,0.08); padding: 2px 5px; border-radius: 4px; }
        pre code { background: none; padding: 0; }

        table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 13px; }
        th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        th { background: #131417; font-weight: 600; color: #fff; }

        .empty { text-align: center; color: var(--text-secondary); margin-top: 100px; font-size: 13px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-head">Stored Sessions</div>
        <div id="session-list"></div>
    </div>
    
    <div id="main">
        <div id="toolbar" style="display:none;">
            <div class="toolbar-group">
                <select id="v-scope">
                    <option value="all">Full Conversation</option>
                    <option value="user">User Prompts Only</option>
                    <option value="ai">Model Responses Only</option>
                </select>
                <label class="cb-row"><input type="checkbox" id="v-user-img" checked> User Images</label>
                <label class="cb-row"><input type="checkbox" id="v-ai-img" checked> AI Images</label>
                <label class="cb-row"><input type="checkbox" id="v-time" checked> Timestamps</label>
                <label class="cb-row"><input type="checkbox" id="v-div" checked> Dividers</label>
            </div>
            
            <div class="toolbar-group">
                <div class="btn-group">
                    <button id="v-dl-txt">TXT</button>
                    <button id="v-dl-md">MD</button>
                    <button id="v-dl-html">HTML</button>
                </div>
                <button id="v-dl-imgs">Download Images Only</button>
            </div>
        </div>

        <div id="content-area">
            <div class="container" id="chat-container">
                <div class="empty">Select a conversation from the sidebar.</div>
            </div>
        </div>
    </div>
    <script src="viewer.js"></script>
</body>
</html>
