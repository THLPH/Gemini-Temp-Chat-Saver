<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 300px; padding: 15px; font-family: system-ui, sans-serif; background: #202124; color: #e8eaed; margin: 0; }
        h3 { margin-top: 0; font-size: 15px; border-bottom: 1px solid #3c4043; padding-bottom: 8px; color: #b388ff; }
        .section { margin-bottom: 16px; background: #292a2d; padding: 10px; border-radius: 8px; border: 1px solid #3c4043; }
        label { font-size: 12px; color: #9aa0a6; display: block; margin-bottom: 5px; }
        select { width: 100%; background: #303134; color: #fff; border: 1px solid #5f6368; padding: 6px; border-radius: 4px; box-sizing: border-box; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 10px; }
        .checkbox-row input { margin: 0; cursor: pointer; }
        .btn-group { display: flex; gap: 6px; margin-top: 8px; }
        button { flex: 1; padding: 8px 0; background: #3c4043; border: 1px solid #5f6368; color: #8ab4f8; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        button:hover { background: #4a4d51; color: #fff; }
        .restore-btn { width: 100%; background: #8ab4f8; color: #000; border: none; margin-top: 8px; }
        .restore-btn:hover { background: #aecbfa; }
        #status { font-size: 11px; color: #81c995; margin-top: 8px; text-align: center; }
        .backup-info { font-size: 11px; color: #9aa0a6; }
    </style>
</head>
<body>
    <h3>Gemini Temp Chat Saver</h3>
    
    <div class="checkbox-row">
        <input type="checkbox" id="protect-toggle" checked>
        <label for="protect-toggle" style="margin:0; cursor:pointer;">Warn before closing tab</label>
    </div>

    <!-- Active Tab Export -->
    <div class="section">
        <label>Export Current Chat:</label>
        <select id="export-scope">
            <option value="all">Full Conversation</option>
            <option value="user">User Prompts Only</option>
            <option value="ai">AI Responses Only</option>
        </select>
        <div class="btn-group">
            <button id="btn-txt">TXT</button>
            <button id="btn-md">MD</button>
            <button id="btn-html">HTML</button>
        </div>
    </div>

    <!-- Offline Recovery -->
    <div class="section">
        <label>Offline Chat Recovery:</label>
        <div class="backup-info" id="backup-status">No backup found yet.</div>
        <button class="restore-btn" id="btn-open-offline">📂 Open Restored Chat Viewer</button>
    </div>

    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>
