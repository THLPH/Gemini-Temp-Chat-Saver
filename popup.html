<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 300px; padding: 14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #18181b; color: #f4f4f5; margin: 0; box-sizing: border-box; }
        h3 { margin: 0 0 12px 0; font-size: 14px; font-weight: 600; color: #e4e4e7; border-bottom: 1px solid #27272a; padding-bottom: 8px; }
        .section { margin-bottom: 12px; background: #27272a; padding: 10px; border-radius: 6px; border: 1px solid #3f3f46; }
        label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #a1a1aa; display: block; margin-bottom: 6px; font-weight: 600; }
        select { width: 100%; background: #18181b; color: #f4f4f5; border: 1px solid #3f3f46; padding: 6px 8px; border-radius: 4px; font-size: 12px; outline: none; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 12px; color: #d4d4d8; }
        .checkbox-row input { margin: 0; cursor: pointer; accent-color: #8b5cf6; }
        .btn-group { display: flex; gap: 6px; margin-top: 8px; }
        button { flex: 1; padding: 6px 0; background: #3f3f46; border: none; color: #f4f4f5; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 12px; transition: background 0.15s ease; }
        button:hover { background: #52525b; }
        .restore-btn { width: 100%; background: #6d28d9; color: #fff; margin-top: 8px; font-weight: 600; }
        .restore-btn:hover { background: #7c3aed; }
        #status { font-size: 11px; color: #a1a1aa; margin-top: 8px; text-align: center; min-height: 14px; }
        .backup-info { font-size: 11px; color: #a1a1aa; }
    </style>
</head>
<body>
    <h3>Gemini Temp Saver</h3>
    
    <div class="checkbox-row">
        <input type="checkbox" id="protect-toggle" checked>
        <label for="protect-toggle" style="cursor:pointer; text-transform:none; margin:0; font-weight:normal;">Warn before closing active chat</label>
    </div>

    <div class="section">
        <label>Export Current</label>
        <select id="export-scope">
            <option value="all">Full Conversation</option>
            <option value="user">User Prompts Only</option>
            <option value="ai">AI Responses Only</option>
        </select>
        <div class="btn-group">
            <button id="btn-txt">TXT</button>
            <button id="btn-md">MD</button>
            <button id="btn-html">HTML</button>
        </div>
    </div>

    <div class="section">
        <label>Recovery Cache</label>
        <div class="backup-info" id="backup-status">Reading storage...</div>
        <button class="restore-btn" id="btn-open-offline">View Saved Session</button>
    </div>

    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>
